<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description"
        content="Open a sealed pool, build your deck, then see what everyone else built from the same six boosters.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sealed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sealed</title>
  <link rel="manifest" href="manifest.json">

  <!-- Link preview for Discord and WhatsApp. Absolute URLs: scrapers do not
       resolve relative ones. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Moxify MTG">
  <meta property="og:url" content="https://sealed.moxifymtg.com/">
  <meta property="og:title" content="Sealed">
  <meta property="og:description"
        content="Same six boosters, everyone builds, then compare and discuss.">
  <meta property="og:image" content="https://sealed.moxifymtg.com/icons/Icon-192.png">
  <meta property="og:image:width" content="192">
  <meta property="og:image:height" content="192">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sealed">
  <meta name="twitter:description" content="Same six boosters, everyone builds, then compare and discuss.">
  <meta name="twitter:image" content="https://sealed.moxifymtg.com/icons/Icon-192.png">
  <meta name="theme-color" content="#8B5CF6">

  <!-- Built with --pwa-strategy=none (no service worker). Unregister any SW an
       older build left behind, so it stops serving a stale app. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
